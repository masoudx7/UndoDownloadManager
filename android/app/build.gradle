apply plugin: 'com.android.application'

android {
    namespace "com.undodownloadmanager.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.undodownloadmanager.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        manifestPlaceholders = [
            marketApplicationId: "com.farsitel.bazaar", // شناسه استاندارد بازار
            marketBindAddress: "com.farsitel.bazaar",
            marketPermission: "com.farsitel.bazaar.permission.PAYMENT"
        ]

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*.jar:!*.apk:!*.swp:!*.tmp:!*.bak:!*.log:!~'
            noCompress 'yt-dlp', 'ffmpeg'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "undodownloadmanager-release-key.jks"
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def keyAli = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASSWORD")

            def ksFile = file(keystorePath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword (storePass != null && !storePass.isEmpty() ? storePass : "undodownload123")
                keyAlias (keyAli != null && !keyAli.isEmpty() ? keyAli : "undodownload-alias")
                keyPassword (keyPass != null && !keyPass.isEmpty() ? keyPass : "undodownload123")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "undodownloadmanager-release-key.jks")
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.undodownloadmanager.app"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.undodownloadmanager.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a'
        }

        manifestPlaceholders = [
            marketApplicationId: "com.farsitel.bazaar", // شناسه استاندارد بازار
            marketBindAddress: "com.farsitel.bazaar",
            marketPermission: "com.farsitel.bazaar.permission.PAYMENT"
        ]

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*.jar:!*.apk:!*.swp:!*.tmp:!*.bak:!*.log:!~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                '**/libc++_shared.so',
                '**/libpython*.so',
                '**/libffmpeg*.so',
                '**/libcrypto*.so',
                '**/libssl*.so',
                'lib/arm64-v8a/libc++_shared.so'
            ]
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def keyAli = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASSWORD")

            // Strict check: Only configure release signing if ALL credentials are provided via ENV
            if (keystorePath && storePass && keyAli && keyPass) {
                def ksFile = file(keystorePath)
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword storePass
                    keyAlias keyAli
                    keyPassword keyPass
                    project.logger.lifecycle("✅ Release signing configured via environment variables.")
                } else {
                    project.logger.warn("⚠️ KEYSTORE_PATH provided but file does not exist: ${keystorePath}")
                }
            } else {
                project.logger.lifecycle("ℹ️ Release signing credentials missing in environment. Build will fail if 'assembleRelease' or 'bundleRelease' is called.")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Apply release signing only if credentials were successfully loaded
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                // Fail release builds early if signing is requested but not configured
                gradle.taskGraph.whenReady { taskGraph ->
                    if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask(":app:bundleRelease")) {
                        throw new GradleException("🚨 PRODUCTION BUILD FAILED: Release signing credentials (KEYSTORE_PATH, etc.) are missing or invalid.")
                    }
                }
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreWarnings true
        disable 'MissingTranslation', 'ExtraTranslation', 'ValidFragment', 'ExportedService', 'UnusedResources', 'ExpiredTargetSdkVersion', 'ExtractNativeLibs'
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:${rootProject.ext.androidxCoreVersion ?: '1.17.0'}"
        force "androidx.core:core-ktx:${rootProject.ext.androidxCoreVersion ?: '1.17.0'}"
        force "androidx.activity:activity:${rootProject.ext.androidxActivityVersion ?: '1.11.0'}"
        force "androidx.activity:activity-ktx:${rootProject.ext.androidxActivityVersion ?: '1.11.0'}"
        force "androidx.appcompat:appcompat:$androidxAppCompatVersion"
        force "androidx.fragment:fragment:$androidxFragmentVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.core:core:${rootProject.ext.androidxCoreVersion ?: '1.17.0'}"
    implementation "androidx.core:core-ktx:${rootProject.ext.androidxCoreVersion ?: '1.17.0'}"
    implementation "androidx.activity:activity:${rootProject.ext.androidxActivityVersion ?: '1.11.0'}"
    implementation "androidx.activity:activity-ktx:${rootProject.ext.androidxActivityVersion ?: '1.11.0'}"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Kotlin Standard Library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // On-device Android yt-dlp & ffmpeg engine (Bionic libc & NDK)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}

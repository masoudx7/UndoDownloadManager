name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کد از ریپازیتوری
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. راه‌اندازی Bun (جایگزین مدرن و سریع‌تر Node.js/npm)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ۳. نصب وابستگی‌ها با استفاده از Bun (به صورت خودکار bun.lock را می‌خواند)
      - name: Install Dependencies
        run: bun install

      # ۴. بررسی تایپ‌ها و لینت (طبق اسکریپت package.json شما)
      - name: Type Check & Lint
        run: bun run lint

      # ۵. دانلود باینری‌های بومی (yt-dlp و ffmpeg)
      - name: Download Native Binaries
        run: bun run download-binaries

      # ۶. بیلد گرفتن از بخش فرانت‌اند (Vite)
      - name: Build Web Application
        run: bun run build

      # ۷. راه‌اندازی Java JDK (الزامی برای بیلد اندروید)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ۸. سینک کردن پروژه وب با پوشه بومی اندروید (Capacitor)
      - name: Sync Capacitor Android
        run: bunx cap sync android

      # ۹. بیلد گرفتن از پروژه اندروید (نسخه Debug برای تست سریع در CI)
      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ۱۰. آپلود فایل APK ساخته شده به عنوان Artifact (برای دانلود دستی از گیت‌هاب)
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: undo-download-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

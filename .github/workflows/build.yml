name: Build Android (Cafe Bazaar & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository with existing android/ project preserved
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 21 for modern Android Gradle builds
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Install Node dependencies
      - name: Install Dependencies
        run: bun install

      # 5. Download Native Binaries into assets/bin before build
      - name: Download Native Binaries
        run: |
          chmod +x scripts/download-binaries.sh || true
          bun run download-binaries || true

      # 6. Build Web Frontend (Vite)
      - name: Build Web Application
        run: bun run build

      # 7. Sync Web Assets with Android Project (DO NOT delete android/ or re-add)
      - name: Sync Capacitor Android
        run: bunx cap sync android

      # 8. Setup Keystore (Secret or Auto-generate for CI release signing)
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/undodownloadmanager-release-key.jks
            echo "✅ Release Keystore decoded from secret successfully."
          elif [ ! -f "android/app/undodownloadmanager-release-key.jks" ]; then
            echo "⚡ Generating release keystore for CI build..."
            keytool -genkeypair -v -keystore android/app/undodownloadmanager-release-key.jks \
              -alias undodownload-alias \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass undodownload123 -keypass undodownload123 \
              -dname "CN=UndoDownloadManager, OU=Mobile, O=UndoDownloadManager, L=Tehran, ST=Tehran, C=IR"
            echo "✅ Release keystore generated successfully."
          fi

      # 9. Build Android APKs (Debug & Release)
      - name: Build Android APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          echo "🔨 Building Debug APK..."
          ./gradlew assembleDebug --stacktrace
          echo "🔨 Building Release APK..."
          ./gradlew assembleRelease --stacktrace
          echo "🔍 Generated APKs:"
          find . -name "*.apk" -type f

      # 10. Upload APKs as GitHub Actions Artifacts
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: undo-download-manager-apks
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14

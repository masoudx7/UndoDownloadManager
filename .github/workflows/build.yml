name: Build Bazaar Version

on:
  push:
    branches: [ "main" ]

jobs:
  build-bazaar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Download Native Binaries
        run: bun run download-binaries

      - name: Build Web Application
        run: bun run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean old Android folder
        run: rm -rf android
      
      - name: Re-add Android Platform
        run: bunx cap add android
      
      - name: Sync Capacitor
        run: bunx cap sync android

      # ==========================================================
      # 🎯 راه‌حل قطعی: بازنویسی settings.gradle بعد از cap sync
      # این کار را حتماً باید بعد از sync انجام دهیم چون
      # cap sync فایل را از template خودش بازنویسی می‌کند
      # ==========================================================
      - name: Fix settings.gradle with JitPack
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          
          include ':app'
          include ':capacitor-cordova-android-plugins'
          project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
          apply from: 'capacitor.settings.gradle'
          EOF
          echo "✅ settings.gradle fixed with JitPack"

      # بازنویسی build.gradle ریشه برای پاکسازی
      - name: Fix root build.gradle
        run: |
          cat > android/build.gradle << 'EOF'
          // Top-level build file
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.9.1'
                  classpath 'com.google.gms:google-services:4.4.1'
              }
          }
          
          apply from: "variables.gradle"
          
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "✅ build.gradle cleaned up"
      # ==========================================================

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: undo-download-manager-bazaar-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

name: Build Android (Cafe Bazaar & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Application
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "✅ Release Keystore decoded successfully."
          else
            echo "⚠️ KEYSTORE_BASE64 secret is missing. Skipping production signing setup."
          fi

      - name: Build Android APKs
        env:
          KEYSTORE_PATH: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          
          echo "🔨 Building Debug APK..."
          ./gradlew :app:assembleDebug --stacktrace
          
          if [ -f "app/release-key.jks" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "🔨 Building Production Release APK..."
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "⏩ Skipping Production Release APK (Keystore or Secrets missing)."
          fi
          
          echo "🔍 Generated APKs:"
          find . -name "*.apk" -type f

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: undo-download-manager-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

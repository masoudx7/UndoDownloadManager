name: Build and Test (Multi-Store)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کد از ریپازیتوری
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. راه‌اندازی Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ۳. نصب وابستگی‌ها
      - name: Install Dependencies
        run: bun install

      # ۴. بررسی تایپ‌ها و لینت
      - name: Type Check & Lint
        run: bun run lint

      # ۵. دانلود باینری‌های بومی (yt-dlp و ffmpeg)
      - name: Download Native Binaries
        run: bun run download-binaries

      # ۶. بیلد گرفتن از بخش فرانت‌اند (Vite)
      - name: Build Web Application
        run: bun run build

      # ۷. راه‌اندازی Java JDK 21
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ۸. سینک کردن پروژه وب با پوشه بومی اندروید
      - name: Sync Capacitor Android
        run: bunx cap sync android

      # ۹. بیلد همزمان هر دو Flavor (بازار و مایکت)
      - name: Build Android APKs (Bazaar & Myket Debug)
        run: |
          cd android
          chmod +x gradlew
          # این دستور هر دو نسخه را به صورت موازی و بهینه کامپایل می‌کند
          ./gradlew assembleBazaarDebug assembleMyketDebug

      # ۱۰. آپلود فایل APK نسخه بازار
      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: undo-download-manager-bazaar-debug
          path: android/app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
          retention-days: 7

      # ۱۱. آپلود فایل APK نسخه مایکت
      - name: Upload Myket APK
        uses: actions/upload-artifact@v4
        with:
          name: undo-download-manager-myket-debug
          path: android/app/build/outputs/apk/myket/debug/app-myket-debug.apk
          retention-days: 7
